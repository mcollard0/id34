plugins {
    id 'com.android.application';
}
def id34KeystoreFile = file('/run/media/michael/FAST_ARCHIVE/Keystore/michaelcollard-pro.keystore')
def id34KeystorePassword = (project.findProperty('ID34_KEYSTORE_PASSWORD') ?: System.getenv('ID34_KEYSTORE_PASSWORD')) as String
def id34KeyAlias = (project.findProperty('ID34_KEY_ALIAS') ?: System.getenv('ID34_KEY_ALIAS') ?: 'michaelcollard-pro') as String
def id34KeyPassword = (project.findProperty('ID34_KEY_PASSWORD') ?: System.getenv('ID34_KEY_PASSWORD')) as String
def hasId34SigningCreds = id34KeystoreFile.exists() && id34KeystorePassword && id34KeyPassword

android {
    namespace 'pro.michaelcollard.id34';
    compileSdk 35;

    defaultConfig {
        applicationId 'pro.michaelcollard.id34';
        minSdk 23;
        targetSdk 35;
        versionCode 1;
        versionName '3.0.0-beta';
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner';
    }
    signingConfigs {
        id34release {
            storeFile id34KeystoreFile
            storePassword id34KeystorePassword ?: ''
            keyAlias id34KeyAlias
            keyPassword id34KeyPassword ?: ''
        }
    }

    buildTypes {
        debug {
            if (hasId34SigningCreds) {
                signingConfig signingConfigs.id34release
            }
        }
        release {
            minifyEnabled false;
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro';
            if (hasId34SigningCreds) {
                signingConfig signingConfigs.id34release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17;
        targetCompatibility JavaVersion.VERSION_17;
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0';
    implementation 'androidx.core:core-ktx:1.13.1';
    implementation 'com.google.android.material:material:1.12.0';
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0';
    implementation 'androidx.recyclerview:recyclerview:1.3.2';
    implementation 'com.google.android.gms:play-services-auth:21.2.0';
    implementation 'com.squareup.okhttp3:okhttp:4.12.0';
}
