apply plugin: 'com.android.application'

android {
    compileSdkVersion 28
    buildToolsVersion "28.0.3"
    defaultConfig {
        applicationId "com.promethylhosting.id34"
        minSdkVersion 19  // Wider compatibility while still modern
        targetSdkVersion 28  // Target Android 9 (still modern)
        versionCode 8  // Updated for SDK 28 compatibility
        versionName '2.2.0-android28'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    
    // Fix linting issues for legacy code
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Minimal working build without external dependencies
    // Using only Android SDK classes to avoid dependency issues
}
